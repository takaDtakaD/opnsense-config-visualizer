<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OPNsense 設定ビジュアライザ</title>
<style>
  :root{
    --bg:#f6f7f9; --panel:#fff; --ink:#16181d; --muted:#5f6672; --line:#e2e5ea;
    --pass:#0f7b46; --pass-bg:#e6f4ec; --block:#b3261e; --block-bg:#fdecea;
    --reject:#a15c00; --reject-bg:#fdf3e2; --accent:#2f5bd7; --accent-bg:#eaf0ff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic",Meiryo,system-ui,sans-serif;
    font-size:14px; line-height:1.6;
  }
  code,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace; font-size:.92em}
  header{background:#fff;border-bottom:1px solid var(--line);padding:18px 24px}
  header h1{margin:0;font-size:18px;letter-spacing:.01em}
  header p{margin:4px 0 0;color:var(--muted);font-size:12.5px}
  main{max-width:1080px;margin:0 auto;padding:24px}
  section.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin-bottom:18px}
  h2{font-size:14px;margin:0 0 12px;letter-spacing:.02em;text-transform:none;color:#2b2f38}
  h2 .sub{font-weight:400;color:var(--muted);font-size:12px;margin-left:8px}
  #drop{
    border:2px dashed #c3c9d4;border-radius:12px;padding:34px 20px;text-align:center;
    background:#fbfcfd;cursor:pointer;transition:.15s;
  }
  #drop.hover{border-color:var(--accent);background:var(--accent-bg)}
  #drop strong{display:block;font-size:15px;margin-bottom:6px}
  #drop span{color:var(--muted);font-size:12.5px}
  #err{display:none;margin-top:12px;padding:10px 12px;border-radius:8px;background:var(--block-bg);color:var(--block);font-size:13px}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
  .card{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:#fcfcfd}
  .card .k{color:var(--muted);font-size:11.5px}
  .card .v{font-size:17px;font-weight:600;margin-top:2px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--muted);font-weight:600;font-size:11.5px;letter-spacing:.04em;white-space:nowrap;background:#fafbfc}
  tbody tr:hover{background:#fafbfd}
  .badge{display:inline-block;padding:1px 7px;border-radius:999px;font-size:11px;font-weight:600;white-space:nowrap}
  .b-pass{background:var(--pass-bg);color:var(--pass)}
  .b-block{background:var(--block-bg);color:var(--block)}
  .b-reject{background:var(--reject-bg);color:var(--reject)}
  .b-off{background:#eceef2;color:#6b7280}
  .b-log{background:var(--accent-bg);color:var(--accent)}
  tr.off td{opacity:.5;text-decoration:line-through}
  .toolbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:12px}
  .tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:12.5px;cursor:pointer;color:#3b414c}
  .tab[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
  .tab .n{opacity:.6;margin-left:5px;font-size:11px}
  input[type=search]{margin-left:auto;min-width:220px;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px;background:#fff}
  .warn{display:flex;gap:10px;padding:9px 12px;border-radius:8px;margin-bottom:8px;font-size:13px;border:1px solid transparent}
  .warn.danger{background:var(--block-bg);color:#7a1a14;border-color:#f3c9c4}
  .warn.warn{background:var(--reject-bg);color:#6d4000;border-color:#f0dcbb}
  .warn.info{background:var(--accent-bg);color:#1f3d8f;border-color:#cfdcff}
  .warn b{white-space:nowrap}
  svg{max-width:100%;height:auto;display:block}
  .legend{color:var(--muted);font-size:11.5px;margin-top:8px}
  .empty{color:var(--muted);font-size:13px;padding:10px 0}
  #report[hidden]{display:none}
  table.matrix td.cell{text-align:center;font-size:12.5px;font-weight:600;cursor:pointer;border:1px solid #fff}
  table.matrix td.cell span{display:block;font-weight:400;font-size:10.5px;color:#6b7280}
  td.cell.ok{background:var(--pass-bg);color:var(--pass)}
  td.cell.no{background:var(--block-bg);color:var(--block)}
  td.cell.warn{background:var(--reject-bg);color:var(--reject)}
  td.cell.same{background:#f1f2f5;color:#9aa0aa;font-weight:400;font-size:11.5px;cursor:default}
  td.cell:hover{outline:2px solid var(--ink);outline-offset:-2px}
  .detail{margin-top:12px;border:1px solid var(--line);border-radius:8px;padding:12px 14px;background:#fcfcfd}
  .detail h3{margin:0 0 6px;font-size:13px}
  .detail p{margin:6px 0}
  .verdict{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700}
  .verdict.ok{background:var(--pass-bg);color:var(--pass)}
  .verdict.no{background:var(--block-bg);color:var(--block)}
  .detail table th{width:90px}
  .tester{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
  .tester label{display:flex;flex-direction:column;gap:4px;font-size:11.5px;color:var(--muted)}
  .tester label.wide{flex:1 1 160px}
  .tester select,.tester input{border:1px solid var(--line);border-radius:7px;padding:6px 9px;font-size:13px;background:#fff;min-width:130px}
  .tester button{border:0;background:var(--ink);color:#fff;border-radius:8px;padding:8px 18px;font-size:13px;cursor:pointer}
  .tester button:hover{background:#000}
  @media print{
    header,#drop,#err,.toolbar input{display:none}
    body{background:#fff}
    section.panel{break-inside:avoid;border-color:#ccc}
  }
</style>
</head>
<body>
<header>
  <h1>OPNsense 設定ビジュアライザ</h1>
  <p>config.xml をドロップすると、インターフェース・ファイアウォールルール・NAT・DHCP を整理して表示します。ファイルはブラウザ内だけで処理され、どこにも送信されません。</p>
</header>
<main>
  <section class="panel" id="droppanel">
    <div id="drop" tabindex="0" role="button" aria-label="config.xml を選択">
      <strong>config.xml をここにドロップ</strong>
      <span>またはクリックして選択（System → Configuration → Backups でダウンロードしたもの）</span>
    </div>
    <input type="file" id="file" accept=".xml,application/xml,text/xml" hidden>
    <div id="err"></div>
  </section>
  <div id="report" hidden></div>
</main>
<script>
"use strict";
/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const kids = el => (el ? Array.from(el.children) : []);
const byTag = (el, tag) => kids(el).filter(c => c.nodeName === tag);
function txt(el, tag) {
  if (!el) return "";
  const n = el.getElementsByTagName(tag);
  return n.length ? (n[0].textContent || "").trim() : "";
}
function has(el, tag) { return !!el && el.getElementsByTagName(tag).length > 0; }
function first(el, sel) { return el ? el.querySelector(sel) : null; }
function splitList(s) { return String(s || "").split(/[,\s]+/).filter(Boolean); }

/* ---------- parse ---------- */
function parseConfig(text) {
  const doc = new DOMParser().parseFromString(text, "application/xml");
  if (doc.getElementsByTagName("parsererror").length) throw new Error("XML の解析に失敗しました。ファイルが壊れていないか確認してください。");
  const root = doc.documentElement;
  if (!root || root.nodeName !== "opnsense") throw new Error("<opnsense> 要素が見つかりません。OPNsense の config.xml を選んでください。");

  const sys = first(root, "system");
  const d = {
    hostname: txt(sys, "hostname") || "(未設定)",
    domain: txt(sys, "domain"),
    timezone: txt(sys, "timezone"),
    version: txt(first(root, "OPNsense"), "version") || txt(sys, "version"),
    dns: byTag(sys, "dnsserver").map(n => n.textContent.trim()).filter(Boolean),
    interfaces: [], vlans: [], rules: [], aliases: [],
    outbound: { mode: "", rules: [] }, forwards: [], dhcp: [], gateways: []
  };

  /* interfaces */
  for (const el of kids(first(root, "interfaces"))) {
    const ip = txt(el, "ipaddr"), sub = txt(el, "subnet");
    let addr = "なし";
    if (ip === "dhcp") addr = "DHCP";
    else if (ip === "pppoe") addr = "PPPoE";
    else if (ip && ip !== "none") addr = ip + (sub ? "/" + sub : "");
    const ip6 = txt(el, "ipaddrv6"), sub6 = txt(el, "subnetv6");
    d.interfaces.push({
      name: el.nodeName,
      label: txt(el, "descr") || el.nodeName.toUpperCase(),
      device: txt(el, "if") || "(未割当)",
      addr,
      cidr: (ip && /^\d{1,3}(\.\d{1,3}){3}$/.test(ip) && sub) ? ip + "/" + sub : "",
      addr6: ip6 && ip6 !== "none" && ip6 !== "dhcp6" ? ip6 + (sub6 ? "/" + sub6 : "") : (ip6 === "dhcp6" ? "DHCPv6" : ""),
      blockpriv: has(el, "blockpriv"),
      blockbogons: has(el, "blockbogons"),
      gw: txt(el, "gateway")
    });
  }
  const labelOf = name => {
    const hit = d.interfaces.find(i => i.name === name);
    return hit ? hit.label : name;
  };
  const ifaceCidr = name => {
    const hit = d.interfaces.find(i => i.name === name);
    return hit && hit.cidr ? hit.cidr : "";
  };

  /* vlans */
  for (const el of byTag(first(root, "vlans"), "vlan")) {
    d.vlans.push({ parent: txt(el, "if"), tag: txt(el, "tag"), descr: txt(el, "descr"), pcp: txt(el, "pcp") });
  }

  /* aliases */
  const aliasMap = new Map();
  for (const el of byTag(first(root, "aliases"), "alias")) {
    const name = txt(el, "name");
    aliasMap.set(name, { type: txt(el, "type"), content: txt(el, "content"), descr: txt(el, "descr") });
  }
  d.aliases = [...aliasMap.entries()].map(([name, v]) => Object.assign({ name }, v));

  /* endpoint: raw（判定用）と display（表示用）の両方を作る */
  function epRaw(el) {
    const port = txt(el, "port") || "any";
    if (!el) return { kind: "any", text: "any", cidrs: null, port: "any" };
    if (has(el, "any")) return { kind: "any", text: "any", cidrs: null, port };
    if (txt(el, "network")) {
      const n = txt(el, "network");
      if (n === "(self)") return { kind: "self", text: "This Firewall", cidrs: null, port };
      if (/[\/:]/.test(n)) return { kind: "cidr", text: n, cidrs: [n], port };
      if (aliasMap.has(n)) return { kind: "alias", text: "alias " + n, cidrs: splitList(aliasMap.get(n).content), port };
      const c = ifaceCidr(n);
      return { kind: "net", text: labelOf(n) + " net", cidrs: c ? [c] : [], port, iface: n };
    }
    if (txt(el, "address")) {
      const a = txt(el, "address");
      if (aliasMap.has(a)) return { kind: "alias", text: "alias " + a, cidrs: splitList(aliasMap.get(a).content), port };
      return { kind: "cidr", text: a, cidrs: splitList(a), port };
    }
    if (txt(el, "interface")) {
      const i = txt(el, "interface");
      return { kind: "net", text: labelOf(i), cidrs: [ifaceCidr(i)].filter(Boolean), port, iface: i };
    }
    return { kind: "any", text: "any", cidrs: null, port };
  }
  function disp(raw) {
    const p = raw.port && raw.port !== "any" ? " : " + raw.port : "";
    return { addr: raw.text + p, port: raw.port };
  }

  /* firewall rules (document order = evaluation order) */
  let order = 0;
  for (const el of byTag(first(root, "filter"), "rule")) {
    const iface = txt(el, "interface") || "(none)";
    const srcR = epRaw(first(el, "source"));
    const dstR = epRaw(first(el, "destination"));
    d.rules.push({
      order: ++order,
      iface,
      label: iface === "(none)" ? "floating" : labelOf(iface),
      floating: txt(el, "floating") === "yes" || iface === "(none)",
      ifacesRaw: splitList(iface),
      type: (txt(el, "type") || "pass").toLowerCase(),
      direction: txt(el, "direction") || "in",
      ipproto: txt(el, "ipprotocol") || "inet",
      proto: (txt(el, "protocol") || "any").toLowerCase(),
      src: disp(srcR),
      dst: disp(dstR),
      srcR,
      dstR,
      descr: txt(el, "descr"),
      disabled: has(el, "disabled"),
      log: has(el, "log"),
      gateway: txt(el, "gateway")
    });
  }

  /* nat */
  const nat = first(root, "nat");
  const ob = first(nat, "outbound");
  if (ob) {
    d.outbound.mode = txt(ob, "mode") || "automatic";
    for (const el of byTag(ob, "rule")) {
      const oSrc = epRaw(first(el, "source"));
      d.outbound.rules.push({
        iface: labelOf(txt(el, "interface")) || "any",
        src: disp(oSrc).addr,
        srcR: oSrc,
        dst: disp(epRaw(first(el, "destination"))).addr,
        target: txt(el, "target") || "interface address",
        descr: txt(el, "descr"),
        disabled: has(el, "disabled")
      });
    }
  }
  for (const el of byTag(nat, "rule")) {
    d.forwards.push({
      iface: labelOf(txt(el, "interface")),
      proto: (txt(el, "protocol") || "tcp").toLowerCase(),
      dstport: txt(el, "dstport") || "any",
      target: txt(el, "target"),
      localport: txt(el, "local-port"),
      descr: txt(el, "descr"),
      disabled: has(el, "disabled")
    });
  }

  /* dhcp */
  for (const el of kids(first(root, "dhcpd"))) {
    const range = first(el, "range");
    d.dhcp.push({
      iface: labelOf(el.nodeName),
      enabled: has(el, "enable"),
      from: txt(range, "from"),
      to: txt(range, "to")
    });
  }

  /* gateways */
  for (const el of byTag(first(root, "gateways"), "gateway_item")) {
    d.gateways.push({ name: txt(el, "name"), iface: labelOf(txt(el, "interface")), gw: txt(el, "gateway"), descr: txt(el, "descr") });
  }

  d._aliases = aliasMap;
  return d;
}

/* ---------- lint ---------- */
function lint(d) {
  const out = [];
  const wan = d.interfaces.find(i => i.name === "wan");
  const openWan = d.rules.filter(r => !r.disabled && r.iface === "wan" && r.type === "pass" && r.src.addr === "any" && r.dst.addr === "any");
  if (openWan.length) out.push({ level: "danger", text: "WAN に「送信元 any → 送信先 any」の許可ルールが " + openWan.length + " 件あります。インターネットに晒す構成では危険です。" });

  if (wan && !wan.blockpriv && /^(10\.|192\.168\.|172\.(1[6-9]|2\d|3[01])\.)/.test(wan.addr)) {
    out.push({ level: "info", text: "WAN がプライベートアドレス（" + wan.addr + "）で、Block private networks が無効です。家庭ルータ配下で GUI に到達させるための設定なら意図どおりです。" });
  }

  const noDesc = d.rules.filter(r => !r.descr);
  if (noDesc.length) out.push({ level: "warn", text: "説明（Description）が空のルールが " + noDesc.length + " 件あります。後から読めなくなるので付けておくのがおすすめです。" });

  const disabled = d.rules.filter(r => r.disabled).length;
  if (disabled) out.push({ level: "info", text: "無効化されているルールが " + disabled + " 件あります（表示は打ち消し線）。" });

  for (const r of d.rules) {
    if (r.disabled || r.type !== "pass") continue;
    if (!r.floating && r.src.addr === r.label + " net" && r.dst.addr === "any") {
      out.push({ level: "info", text: r.label + " は「全許可」ポリシーです（" + (r.descr || "説明なし") + "）。" });
    }
  }

  if (d.interfaces.length > 2 && d.outbound.mode === "automatic") {
    out.push({ level: "warn", text: "NAT が Automatic です。内部インターフェースすべてが WAN に NAT されるため、攻撃検証用セグメントを隔離したい場合は Manual にして必要なネットワークだけ NAT してください。" });
  }

  const dhcpOn = d.dhcp.filter(x => x.enabled);
  if (dhcpOn.length > 1) out.push({ level: "info", text: "DHCP サーバーが " + dhcpOn.length + " インターフェースで有効です（" + dhcpOn.map(x => x.iface).join(", ") + "）。外部で DHCP を配っている場合は二重配布に注意してください。" });

  return out;
}

/* ---------- reachability engine ---------- */
function ipToInt(ip) {
  const p = String(ip).split(".");
  if (p.length !== 4) return null;
  let n = 0;
  for (const s of p) {
    const v = Number(s);
    if (!Number.isInteger(v) || v < 0 || v > 255) return null;
    n = (n << 8) + v;
  }
  return n >>> 0;
}
function intToIp(n) {
  return [24, 16, 8, 0].map(s => (n >>> s) & 255).join(".");
}
function inCidr(ip, cidr) {
  if (!cidr.includes("/")) return ip === cidr;
  const parts = cidr.split("/");
  const bits = Number(parts[1]);
  const a = ipToInt(ip), b = ipToInt(parts[0]);
  if (a === null || b === null || !Number.isFinite(bits)) return false;
  const mask = bits <= 0 ? 0 : (bits >= 32 ? 0xffffffff : (0xffffffff << (32 - bits)) >>> 0);
  return ((a & mask) >>> 0) === ((b & mask) >>> 0);
}
function repIp(cidr) {
  const parts = cidr.split("/");
  const base = ipToInt(parts[0]);
  const bits = Number(parts[1] || 32);
  if (base === null) return parts[0];
  const mask = bits <= 0 ? 0 : (bits >= 32 ? 0xffffffff : (0xffffffff << (32 - bits)) >>> 0);
  const net = (base & mask) >>> 0;
  return intToIp((net + (bits >= 30 ? 1 : 10)) >>> 0);
}
function addrMatch(raw, ip) {
  if (!raw) return true;
  if (raw.kind === "any") return true;
  if (raw.kind === "self") return false;
  if (!raw.cidrs || !raw.cidrs.length) return false;
  return raw.cidrs.some(c => inCidr(ip, c));
}
function protoMatch(r, proto) {
  const rp = (r.proto || "any").toLowerCase();
  if (!proto || proto === "any" || rp === "any") return true;
  return rp.split(/[\/,\s]+/).includes(proto);
}
function portMatch(d, raw, port) {
  const p = String((raw && raw.port) || "any");
  if (p === "any") return true;
  if (port === "" || port === undefined || port === null) return true;
  const q = Number(port);
  if (!Number.isFinite(q)) return true;
  let list = p;
  if (d._aliases && d._aliases.has(p)) list = d._aliases.get(p).content;
  return splitList(list).some(part => {
    if (part.includes("-")) {
      const [a, b] = part.split("-").map(Number);
      return q >= a && q <= b;
    }
    return Number(part) === q;
  });
}
function natFor(d, iface, srcIp) {
  const mode = d.outbound.mode || "automatic";
  if (mode === "disabled") return null;
  if (mode === "automatic") return iface === "wan" ? null : { auto: true };
  if (mode === "hybrid" || mode === "manual") {
    const hit = d.outbound.rules.find(r => !r.disabled && r.srcR && addrMatch(r.srcR, srcIp));
    return hit ? { auto: false, rule: hit } : null;
  }
  return null;
}
function evaluate(d, q) {
  const cands = d.rules.filter(r => !r.disabled).filter(r => {
    if (r.floating) return !r.ifacesRaw.length || r.ifacesRaw.includes(q.iface) || r.ifacesRaw.includes("any");
    return r.iface === q.iface;
  });
  const ordered = cands.filter(r => r.floating).concat(cands.filter(r => !r.floating));
  for (const r of ordered) {
    if (r.ipproto === "inet6") continue;
    if (!protoMatch(r, q.proto)) continue;
    if (r.srcR.kind === "self") continue;
    if (!addrMatch(r.srcR, q.srcIp)) continue;
    if (r.dstR.kind === "self") {
      if (!q.dstIsSelf) continue;
    } else if (!addrMatch(r.dstR, q.dstIp)) continue;
    if (!portMatch(d, r.dstR, q.port)) continue;
    return { verdict: r.type, rule: r };
  }
  return { verdict: "deny", rule: null };
}
function matrixTargets(d) {
  const t = [];
  for (const i of d.interfaces) if (i.cidr) t.push({ key: i.name, label: i.label + " net", ip: repIp(i.cidr) });
  t.push({ key: "__self", label: "This Firewall", self: true });
  t.push({ key: "__inet", label: "インターネット", ip: "8.8.8.8", inet: true });
  return t;
}
const VERDICT_LABEL = { pass: "許可", block: "拒否", reject: "拒否(明示)", deny: "既定拒否" };
function detailHtml(d, q, res, nat, inet) {
  const iface = d.interfaces.find(i => i.name === q.iface);
  let html = '<div class="detail"><h3>' + esc(iface ? iface.label : q.iface) + " → " + esc(q.dstIsSelf ? "This Firewall" : q.dstIp) +
    (q.proto && q.proto !== "any" ? " / " + esc(q.proto) + (q.port ? ":" + esc(q.port) : "") : "") + "</h3>";
  html += '<p><span class="verdict ' + (res.verdict === "pass" ? "ok" : "no") + '">' + VERDICT_LABEL[res.verdict] + "</span></p>";
  if (res.rule) {
    const r = res.rule;
    html += "<table><tbody>" +
      "<tr><th>一致ルール</th><td>#" + r.order + "（" + esc(r.floating ? "floating" : r.label) + "）" + (r.log ? ' <span class="badge b-log">log</span>' : "") + "</td></tr>" +
      "<tr><th>動作</th><td>" + esc(r.type.toUpperCase()) + "</td></tr>" +
      '<tr><th>条件</th><td class="mono">' + esc(r.proto) + " ｜ " + esc(r.src.addr) + " → " + esc(r.dst.addr) + "</td></tr>" +
      "<tr><th>説明</th><td>" + esc(r.descr || "(なし)") + "</td></tr></tbody></table>";
  } else {
    html += '<p class="empty">一致するルールがなく、インターフェース既定の拒否に落ちています。</p>';
  }
  if (inet) {
    html += "<p>" + (nat
      ? "送信 NAT の対象です。外部へは WAN のアドレスに変換されて出ます。"
      : "送信 NAT の対象外です。プライベートアドレスのまま出るため、上流ルータで破棄されます。") + "</p>";
  }
  html += "</div>";
  return html;
}
function matrixSection(d) {
  const srcs = d.interfaces.filter(i => i.cidr);
  const targets = matrixTargets(d);
  if (!srcs.length) return '<p class="empty">IPv4 アドレスを持つインターフェースがないため判定できません。</p>';
  let head = "<tr><th>送信元 ↓ ／ 送信先 →</th>";
  for (const t of targets) head += "<th>" + esc(t.label) + "</th>";
  head += "</tr>";
  let body = "";
  for (const s of srcs) {
    body += '<tr><th>' + esc(s.label) + '<br><span class="mono" style="font-size:11px;color:#8b929e">' + esc(s.cidr) + "</span></th>";
    for (const t of targets) {
      if (t.key === s.name) { body += '<td class="cell same">同一セグメント</td>'; continue; }
      const q = {
        iface: s.name, srcIp: repIp(s.cidr),
        dstIp: t.self ? s.cidr.split("/")[0] : t.ip,
        dstIsSelf: !!t.self, proto: "any", port: ""
      };
      const res = evaluate(d, q);
      const nat = t.inet ? natFor(d, s.name, q.srcIp) : null;
      let cls = res.verdict === "pass" ? "ok" : "no";
      let label = VERDICT_LABEL[res.verdict];
      if (t.inet && res.verdict === "pass" && !nat) { cls = "warn"; label = "NAT なし"; }
      body += '<td class="cell ' + cls + '" data-src="' + esc(s.name) + '" data-dst="' + esc(t.key) + '">' +
        label + (res.rule ? "<span>#" + res.rule.order + "</span>" : "") + "</td>";
    }
    body += "</tr>";
  }
  return '<table class="matrix"><thead>' + head + "</thead><tbody>" + body + "</tbody></table>" +
    '<div id="celldetail"></div>' +
    '<p class="legend">セルをクリックすると一致したルールを表示します。floating ルールを先に、そのあとインターフェースルールを上から評価し、最初に一致したもので確定します（quick）。NAT は送信 NAT の設定だけを見た簡易判定です。</p>';
}
function testerSection(d) {
  const srcOpts = d.interfaces.filter(i => i.cidr).map(i => '<option value="' + esc(i.name) + '">' + esc(i.label) + " (" + esc(i.cidr) + ")</option>").join("");
  const dstOpts = d.interfaces.filter(i => i.cidr).map(i => '<option value="net:' + esc(i.name) + '">' + esc(i.label) + " net</option>").join("") +
    '<option value="self">This Firewall</option><option value="inet">インターネット (8.8.8.8)</option><option value="custom">任意のアドレス</option>';
  return '<form id="tester" class="tester">' +
    "<label>送信元 IF<select name=\"iface\">" + srcOpts + "</select></label>" +
    "<label>送信先<select name=\"dst\">" + dstOpts + "</select></label>" +
    '<label>Proto<select name="proto"><option>any</option><option>tcp</option><option>udp</option><option>icmp</option></select></label>' +
    '<label>ポート<input name="port" placeholder="443" inputmode="numeric" size="6"></label>' +
    '<label class="wide">任意アドレス<input name="addr" placeholder="10.10.5.20"></label>' +
    '<button type="submit">判定</button></form><div id="testerresult"></div>';
}

/* ---------- render: topology ---------- */
function topology(d) {
  const wan = d.interfaces.find(i => i.name === "wan");
  const rest = d.interfaces.filter(i => i.name !== "wan");
  const rowH = 92, pad = 24;
  const W = 980;
  const H = Math.max(240, rest.length * rowH + pad * 2);
  const boxW = 210, boxH = 74;
  const fwX = 360, fwW = 240, fwY = H / 2 - 60, fwH = 120;
  const rightX = 730;
  const parts = [];
  const counts = i => {
    const rs = d.rules.filter(r => !r.floating && r.iface === i.name && !r.disabled);
    return { pass: rs.filter(r => r.type === "pass").length, block: rs.filter(r => r.type !== "pass").length };
  };
  const node = (x, y, title, l1, l2, accent) => {
    parts.push(
      '<g><rect x="' + x + '" y="' + y + '" width="' + boxW + '" height="' + boxH + '" rx="10" fill="#fff" stroke="' + accent + '" stroke-width="1.5"/>' +
      '<text x="' + (x + 14) + '" y="' + (y + 25) + '" font-size="14" font-weight="700" fill="#16181d">' + esc(title) + "</text>" +
      '<text x="' + (x + 14) + '" y="' + (y + 46) + '" font-size="12" fill="#5f6672" font-family="ui-monospace,monospace">' + esc(l1) + "</text>" +
      '<text x="' + (x + 14) + '" y="' + (y + 64) + '" font-size="12" fill="#5f6672" font-family="ui-monospace,monospace">' + esc(l2) + "</text></g>"
    );
  };

  if (wan) {
    const y = H / 2 - boxH / 2;
    node(pad, y, "上流 / " + wan.label, wan.device, wan.addr, "#94a3b8");
    parts.push('<line x1="' + (pad + boxW) + '" y1="' + (y + boxH / 2) + '" x2="' + fwX + '" y2="' + (fwY + fwH / 2) + '" stroke="#94a3b8" stroke-width="1.5"/>');
  }

  parts.push(
    '<g><rect x="' + fwX + '" y="' + fwY + '" width="' + fwW + '" height="' + fwH + '" rx="12" fill="#16181d"/>' +
    '<text x="' + (fwX + fwW / 2) + '" y="' + (fwY + 40) + '" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">OPNsense</text>' +
    '<text x="' + (fwX + fwW / 2) + '" y="' + (fwY + 62) + '" text-anchor="middle" font-size="12" fill="#c9cfda">' + esc(d.hostname + (d.domain ? "." + d.domain : "")) + "</text>" +
    '<text x="' + (fwX + fwW / 2) + '" y="' + (fwY + 84) + '" text-anchor="middle" font-size="11.5" fill="#9aa3b2">ルール ' + d.rules.length + " 件 / NAT " + esc(d.outbound.mode || "-") + "</text>" +
    '<text x="' + (fwX + fwW / 2) + '" y="' + (fwY + 103) + '" text-anchor="middle" font-size="11.5" fill="#9aa3b2">' + esc(d.version ? "v" + d.version : "") + "</text></g>"
  );

  rest.forEach((i, idx) => {
    const y = pad + idx * rowH + (H - pad * 2 - rest.length * rowH) / 2 + (rowH - boxH) / 2;
    const c = counts(i);
    node(rightX, y, i.label, i.device, i.addr, "#c3c9d4");
    parts.push('<line x1="' + (fwX + fwW) + '" y1="' + (fwY + fwH / 2) + '" x2="' + rightX + '" y2="' + (y + boxH / 2) + '" stroke="#c3c9d4" stroke-width="1.5"/>');
    const bx = rightX + boxW - 92, by = y + boxH - 22;
    parts.push('<text x="' + bx + '" y="' + by + '" font-size="11" fill="#0f7b46" font-weight="600">pass ' + c.pass + "</text>");
    parts.push('<text x="' + (bx + 52) + '" y="' + by + '" font-size="11" fill="#b3261e" font-weight="600">block ' + c.block + "</text>");
  });

  return '<svg viewBox="0 0 ' + W + " " + H + '" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="構成図">' + parts.join("") + "</svg>";
}

/* ---------- render: tables ---------- */
function ifaceTable(d) {
  if (!d.interfaces.length) return '<p class="empty">インターフェースがありません。</p>';
  const rows = d.interfaces.map(i =>
    "<tr><td><b>" + esc(i.label) + "</b><br><span class=\"mono\" style=\"color:#5f6672\">" + esc(i.name) + "</span></td>" +
    '<td class="mono">' + esc(i.device) + "</td>" +
    '<td class="mono">' + esc(i.addr) + (i.addr6 ? '<br><span style="color:#5f6672">' + esc(i.addr6) + "</span>" : "") + "</td>" +
    "<td>" + (i.blockpriv ? '<span class="badge b-block">block private</span>' : '<span class="badge b-off">—</span>') +
    (i.blockbogons ? ' <span class="badge b-block">bogons</span>' : "") + "</td>" +
    '<td class="mono">' + esc(i.gw || "—") + "</td></tr>"
  ).join("");
  return "<table><thead><tr><th>インターフェース</th><th>デバイス</th><th>アドレス</th><th>WAN 保護</th><th>ゲートウェイ</th></tr></thead><tbody>" + rows + "</tbody></table>";
}

function vlanTable(d) {
  if (!d.vlans.length) return '<p class="empty">VLAN は定義されていません。</p>';
  const rows = d.vlans.map(v =>
    "<tr><td>" + esc(v.descr || "(説明なし)") + '</td><td class="mono">' + esc(v.parent) + '</td><td class="mono">' + esc(v.tag) + '</td><td class="mono">' + esc(v.pcp || "—") + "</td></tr>"
  ).join("");
  return "<table><thead><tr><th>説明</th><th>親インターフェース</th><th>タグ</th><th>PCP</th></tr></thead><tbody>" + rows + "</tbody></table>";
}

function ruleRows(rules) {
  return rules.map(r => {
    const cls = r.disabled ? "off" : "";
    const b = r.type === "pass" ? "b-pass" : r.type === "reject" ? "b-reject" : "b-block";
    return '<tr class="' + cls + '" data-iface="' + esc(r.floating ? "floating" : r.iface) + '">' +
      '<td class="mono" style="color:#8b929e">' + r.order + "</td>" +
      '<td><span class="badge ' + b + '">' + esc(r.type.toUpperCase()) + "</span>" + (r.log ? ' <span class="badge b-log">log</span>' : "") + "</td>" +
      "<td>" + esc(r.floating ? "floating" : r.label) + "<br><span class=\"mono\" style=\"color:#8b929e;font-size:11px\">" + esc(r.direction) + " / " + esc(r.ipproto) + "</span></td>" +
      '<td class="mono">' + esc(r.proto) + "</td>" +
      '<td class="mono">' + esc(r.src.addr) + "</td>" +
      '<td class="mono">' + esc(r.dst.addr) + "</td>" +
      "<td>" + esc(r.descr || "") + "</td></tr>";
  }).join("");
}

function rulesSection(d) {
  if (!d.rules.length) return '<p class="empty">ファイアウォールルールがありません。</p>';
  const groups = [{ key: "all", label: "すべて", n: d.rules.length }];
  for (const i of d.interfaces) {
    const n = d.rules.filter(r => !r.floating && r.iface === i.name).length;
    if (n) groups.push({ key: i.name, label: i.label, n });
  }
  const nf = d.rules.filter(r => r.floating).length;
  if (nf) groups.push({ key: "floating", label: "floating", n: nf });

  const tabs = groups.map((g, idx) =>
    '<button class="tab" data-tab="' + esc(g.key) + '" aria-pressed="' + (idx === 0) + '">' + esc(g.label) + '<span class="n">' + g.n + "</span></button>"
  ).join("");

  return '<div class="toolbar">' + tabs + '<input type="search" id="q" placeholder="説明・アドレス・ポートで絞り込み"></div>' +
    '<table id="ruletable"><thead><tr><th>#</th><th>動作</th><th>IF</th><th>Proto</th><th>送信元</th><th>送信先</th><th>説明</th></tr></thead><tbody>' +
    ruleRows(d.rules) + "</tbody></table>" +
    '<p class="legend">上から順に評価され、最初に一致したルールで確定します（quick）。無効なルールは打ち消し線で表示しています。</p>';
}

function natSection(d) {
  let html = "<p style=\"margin:0 0 10px\">送信 NAT モード：<b>" + esc(d.outbound.mode || "(未設定)") + "</b></p>";
  if (d.outbound.rules.length) {
    html += "<table><thead><tr><th>IF</th><th>送信元</th><th>送信先</th><th>変換後</th><th>説明</th></tr></thead><tbody>" +
      d.outbound.rules.map(r => '<tr class="' + (r.disabled ? "off" : "") + '"><td>' + esc(r.iface) + '</td><td class="mono">' + esc(r.src) + '</td><td class="mono">' + esc(r.dst) + '</td><td class="mono">' + esc(r.target) + "</td><td>" + esc(r.descr || "") + "</td></tr>").join("") +
      "</tbody></table>";
  } else {
    html += '<p class="empty">送信 NAT の個別ルールはありません（Automatic の場合は内部 IF ごとに自動生成されます）。</p>';
  }
  html += "<h2 style=\"margin-top:18px\">ポートフォワード<span class=\"sub\">" + d.forwards.length + " 件</span></h2>";
  if (d.forwards.length) {
    html += "<table><thead><tr><th>IF</th><th>Proto</th><th>受信ポート</th><th>転送先</th><th>説明</th></tr></thead><tbody>" +
      d.forwards.map(f => '<tr class="' + (f.disabled ? "off" : "") + '"><td>' + esc(f.iface) + '</td><td class="mono">' + esc(f.proto) + '</td><td class="mono">' + esc(f.dstport) + '</td><td class="mono">' + esc(f.target) + (f.localport ? ":" + esc(f.localport) : "") + "</td><td>" + esc(f.descr || "") + "</td></tr>").join("") +
      "</tbody></table>";
  } else {
    html += '<p class="empty">ポートフォワードはありません。</p>';
  }
  return html;
}

function miscSection(d) {
  let html = "";
  if (d.aliases.length) {
    html += "<h2>エイリアス<span class=\"sub\">" + d.aliases.length + " 件</span></h2><table><thead><tr><th>名前</th><th>種別</th><th>内容</th><th>説明</th></tr></thead><tbody>" +
      d.aliases.map(a => "<tr><td><b>" + esc(a.name) + '</b></td><td>' + esc(a.type) + '</td><td class="mono">' + esc(a.content) + "</td><td>" + esc(a.descr || "") + "</td></tr>").join("") +
      "</tbody></table>";
  }
  html += "<h2 style=\"margin-top:18px\">DHCP<span class=\"sub\">" + d.dhcp.filter(x => x.enabled).length + " 有効 / " + d.dhcp.length + " 定義</span></h2>";
  html += d.dhcp.length
    ? "<table><thead><tr><th>IF</th><th>状態</th><th>範囲</th></tr></thead><tbody>" +
      d.dhcp.map(x => "<tr><td>" + esc(x.iface) + '</td><td>' + (x.enabled ? '<span class="badge b-pass">有効</span>' : '<span class="badge b-off">無効</span>') + '</td><td class="mono">' + esc(x.from ? x.from + " - " + x.to : "—") + "</td></tr>").join("") +
      "</tbody></table>"
    : '<p class="empty">DHCP の定義はありません。</p>';

  if (d.gateways.length) {
    html += "<h2 style=\"margin-top:18px\">ゲートウェイ</h2><table><thead><tr><th>名前</th><th>IF</th><th>アドレス</th><th>説明</th></tr></thead><tbody>" +
      d.gateways.map(g => "<tr><td><b>" + esc(g.name) + '</b></td><td>' + esc(g.iface) + '</td><td class="mono">' + esc(g.gw) + "</td><td>" + esc(g.descr || "") + "</td></tr>").join("") +
      "</tbody></table>";
  }
  return html;
}

/* ---------- render: report ---------- */
function render(d) {
  const warnings = lint(d);
  const warnHtml = warnings.map(w => '<div class="warn ' + w.level + '"><b>' + (w.level === "danger" ? "要確認" : w.level === "warn" ? "注意" : "メモ") + "</b><span>" + esc(w.text) + "</span></div>").join("");
  const enabledRules = d.rules.filter(r => !r.disabled);

  const html =
    '<div class="toolbar" style="margin-bottom:12px"><button class="tab" id="reload">別の config.xml を読み込む</button></div>' +
    '<section class="panel"><h2>サマリ</h2><div class="cards">' +
      '<div class="card"><div class="k">ホスト名</div><div class="v" style="font-size:15px">' + esc(d.hostname + (d.domain ? "." + d.domain : "")) + "</div></div>" +
      '<div class="card"><div class="k">バージョン</div><div class="v" style="font-size:15px">' + esc(d.version || "不明") + "</div></div>" +
      '<div class="card"><div class="k">インターフェース</div><div class="v">' + d.interfaces.length + "</div></div>" +
      '<div class="card"><div class="k">ルール（有効）</div><div class="v">' + enabledRules.length + "<span style=\"font-size:12px;color:#5f6672\"> / " + d.rules.length + "</span></div></div>" +
      '<div class="card"><div class="k">VLAN</div><div class="v">' + d.vlans.length + "</div></div>" +
      '<div class="card"><div class="k">タイムゾーン</div><div class="v" style="font-size:14px">' + esc(d.timezone || "—") + "</div></div>" +
    "</div></section>" +
    '<section class="panel"><h2>通信可否マトリクス<span class="sub">送信元 → 送信先</span></h2>' + matrixSection(d) + "</section>" +
    '<section class="panel"><h2>通信の判定テスト</h2>' + testerSection(d) + "</section>" +
    '<section class="panel"><h2>構成図</h2>' + topology(d) + '<p class="legend">線はインターフェースの接続関係のみを表します。ルールの可否は各ノードの pass / block 件数です。</p></section>' +
    (warnHtml ? '<section class="panel"><h2>気になるところ<span class="sub">' + warnings.length + " 件</span></h2>" + warnHtml + "</section>" : "") +
    '<section class="panel"><h2>インターフェース</h2>' + ifaceTable(d) + "</section>" +
    '<section class="panel"><h2>ファイアウォールルール<span class="sub">' + d.rules.length + " 件</span></h2>" + rulesSection(d) + "</section>" +
    '<section class="panel"><h2>NAT</h2>' + natSection(d) + "</section>" +
    '<section class="panel"><h2>その他</h2>' + miscSection(d) + "</section>" +
    '<section class="panel"><h2>VLAN</h2>' + vlanTable(d) + "</section>";

  const rep = $("#report");
  rep.innerHTML = html;
  rep.hidden = false;
  const dp = $("#droppanel");
  if (dp) dp.hidden = true;
  const rb = $("#reload");
  if (rb) rb.addEventListener("click", () => {
    if (dp) dp.hidden = false;
    rep.hidden = true;
    $("#file").value = "";
    window.scrollTo({ top: 0, behavior: "smooth" });
  });

  /* reachability matrix: cell click */
  const celldetail = $("#celldetail");
  const targets = matrixTargets(d);
  document.querySelectorAll("td.cell[data-src]").forEach(td => {
    td.addEventListener("click", () => {
      const s = d.interfaces.find(i => i.name === td.dataset.src);
      const t = targets.find(x => x.key === td.dataset.dst);
      if (!s || !t || !celldetail) return;
      const q = {
        iface: s.name, srcIp: repIp(s.cidr),
        dstIp: t.self ? s.cidr.split("/")[0] : t.ip,
        dstIsSelf: !!t.self, proto: "any", port: ""
      };
      celldetail.innerHTML = detailHtml(d, q, evaluate(d, q), t.inet ? natFor(d, s.name, q.srcIp) : null, !!t.inet);
    });
  });

  /* policy tester */
  const form = $("#tester");
  if (form) {
    form.addEventListener("submit", ev => {
      ev.preventDefault();
      const f = new FormData(form);
      const iface = String(f.get("iface"));
      const s = d.interfaces.find(i => i.name === iface);
      if (!s) return;
      const dstVal = String(f.get("dst"));
      const proto = String(f.get("proto") || "any");
      const port = String(f.get("port") || "").trim();
      let dstIp = "", dstIsSelf = false, inet = false;
      if (dstVal === "self") { dstIp = s.cidr.split("/")[0]; dstIsSelf = true; }
      else if (dstVal === "inet") { dstIp = "8.8.8.8"; inet = true; }
      else if (dstVal === "custom") {
        dstIp = String(f.get("addr") || "").trim();
        if (!/^\d{1,3}(\.\d{1,3}){3}$/.test(dstIp)) { $("#testerresult").innerHTML = '<p class="empty">任意アドレスに IPv4 アドレスを入力してください。</p>'; return; }
      } else {
        const t = d.interfaces.find(i => i.name === dstVal.replace("net:", ""));
        dstIp = t ? repIp(t.cidr) : "";
      }
      const q = { iface, srcIp: repIp(s.cidr), dstIp, dstIsSelf, proto, port };
      $("#testerresult").innerHTML = detailHtml(d, q, evaluate(d, q), inet ? natFor(d, iface, q.srcIp) : null, inet);
    });
  }

  /* tabs + search */
  let tab = "all";
  const applyFilter = () => {
    const q = ($("#q").value || "").trim().toLowerCase();
    document.querySelectorAll("#ruletable tbody tr").forEach(tr => {
      const ifaceOk = tab === "all" || tr.dataset.iface === tab;
      const textOk = !q || tr.textContent.toLowerCase().includes(q);
      tr.style.display = ifaceOk && textOk ? "" : "none";
    });
  };
  document.querySelectorAll(".tab").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-pressed", "false"));
      btn.setAttribute("aria-pressed", "true");
      tab = btn.dataset.tab;
      applyFilter();
    });
  });
  const q = $("#q");
  if (q) q.addEventListener("input", applyFilter);

  window.scrollTo({ top: 0, behavior: "smooth" });
}

/* ---------- input handling ---------- */
function showError(msg) {
  const e = $("#err");
  e.textContent = msg;
  e.style.display = "block";
}
function handleFile(file) {
  if (!file) return;
  $("#err").style.display = "none";
  const reader = new FileReader();
  reader.onload = () => {
    try {
      render(parseConfig(String(reader.result)));
    } catch (e) {
      showError("読み込みに失敗しました: " + e.message);
    }
  };
  reader.onerror = () => showError("ファイルを読めませんでした。");
  reader.readAsText(file, "utf-8");
}

const drop = $("#drop"), input = $("#file");
drop.addEventListener("click", () => input.click());
drop.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); input.click(); } });
input.addEventListener("change", () => handleFile(input.files[0]));
["dragenter", "dragover"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("hover"); }));
["dragleave", "drop"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("hover"); }));
drop.addEventListener("drop", e => { if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]); });
window.addEventListener("dragover", e => e.preventDefault());
window.addEventListener("drop", e => e.preventDefault());
</script>
</body>
</html>
